server.port=8081
spring.application.name=bema-user-service

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

identity-service.base-url=${IDENTITY_SERVICE_URL}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.jackson.deserialization.fail-on-unknown-properties=true

logging.level.org.springframework.security=INFO

# Production
spring.jpa.open-in-view=false

management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# Structured JSON logging
logging.structured.format.console=logstash
